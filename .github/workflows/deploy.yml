name: Deploy to VPS

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # set -e : toute commande qui échoue arrête le script et fait
            # échouer le job (sinon le pipeline reste vert sans rien déployer).
            set -eo pipefail

            cd ~/prod/campaign_tow
            GIT_SSH_COMMAND="ssh -i ~/.ssh/github_deploy" git pull origin main

            # Release Sentry = SHA du commit déployé. Le .git étant exclu du
            # contexte Docker, on passe la valeur via l'env — lue par
            # ops/docker-compose.prod.yml en build-arg (sourcemaps) ET en runtime
            # (tag des events). export = visible par les commandes docker compose.
            export SENTRY_RELEASE=$(git rev-parse HEAD)
            echo "Release Sentry : $SENTRY_RELEASE"

            # Pas de sudo : vps_ben est membre du groupe docker
            COMPOSE="docker compose -p campaign_tow --env-file .env -f ops/docker-compose.prod.yml"

            on_error() {
              echo "ÉCHEC : état Compose au moment de l'erreur"
              $COMPOSE ps || true
            }
            trap on_error ERR

            # Garantir que les services de support existent avant le blue-green app.
            $COMPOSE up -d db docker-socket-proxy traefik pg_backup

            $COMPOSE build --no-cache app

            # Conteneur actuel, capturé AVANT le scale (identification fiable)
            OLD_CONTAINERS=$($COMPOSE ps -q app)
            OLD_COUNT=$(printf '%s\n' "$OLD_CONTAINERS" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$OLD_COUNT" != "1" ]; then
              echo "ÉCHEC : attendu exactement 1 ancien conteneur app, trouvé $OLD_COUNT"
              $COMPOSE ps app
              exit 1
            fi
            OLD_CONTAINER=$OLD_CONTAINERS
            echo "Ancien conteneur : $OLD_CONTAINER"

            # Blue-green : démarre le nouveau conteneur à côté de l'ancien
            $COMPOSE up -d --no-deps --scale app=2 --no-recreate app

            # Le nouveau conteneur = celui qui n'est pas l'ancien
            APP_CONTAINERS=$($COMPOSE ps -q app)
            NEW_CONTAINERS=$(printf '%s\n' "$APP_CONTAINERS" | grep -v -F "$OLD_CONTAINER" || true)
            NEW_COUNT=$(printf '%s\n' "$NEW_CONTAINERS" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$NEW_COUNT" != "1" ]; then
              echo "ÉCHEC : attendu exactement 1 nouveau conteneur app, trouvé $NEW_COUNT"
              $COMPOSE ps app
              exit 1
            fi
            NEW_CONTAINER=$NEW_CONTAINERS
            echo "Nouveau conteneur : $NEW_CONTAINER"

            # Attendre que le nouveau conteneur soit réellement healthy (max 60s)
            echo "Attente du healthcheck..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$NEW_CONTAINER")
              echo "  [$i/30] $STATUS"
              [ "$STATUS" = "healthy" ] && break
              if [ "$i" = "30" ]; then
                echo "ÉCHEC : le nouveau conteneur n'est jamais devenu healthy"
                exit 1
              fi
              sleep 2
            done

            # Bascule réussie : retirer l'ancien conteneur
            docker stop "$OLD_CONTAINER"
            docker rm "$OLD_CONTAINER"

            # Revenir à scale=1
            $COMPOSE up -d --no-deps --scale app=1 --no-recreate app

            docker image prune -f

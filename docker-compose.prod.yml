services:
  # ── Reverse proxy ──
  traefik:
    image: traefik:v2.11
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=ACME_EMAIL_REDACTED
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  # ── Application ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_SENTRY_DSN est inliné dans le bundle browser au build —
        # changer le DSN nécessite donc un rebuild de l'image.
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
        # Release Sentry = SHA du commit (exporté par deploy.yml avant le build).
        SENTRY_RELEASE: ${SENTRY_RELEASE:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      # SENTRY_DSN runtime — pour le tunnel serveur (lu par tunnel.ts)
      - SENTRY_DSN=${SENTRY_DSN}
      # SENTRY_RELEASE runtime — tag les events serveur avec la version déployée
      # (doit matcher la release sous laquelle les sourcemaps sont uploadées).
      - SENTRY_RELEASE=${SENTRY_RELEASE:-unknown}
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`old-world-campaign.ben-lds.com`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls.certresolver=letsencrypt
      - traefik.http.services.app.loadbalancer.server.port=3000

  # ── Database ──
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backup cron ──
  pg_backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - pg_backups:/backups
    entrypoint: >
      bash -c "
        while true; do
          FILENAME=/backups/${POSTGRES_DB}_$$(date +%Y%m%d_%H%M%S).sql.gz
          echo \"[backup] Starting: $$FILENAME\"
          pg_dump | gzip > $$FILENAME
          # Garder les 7 derniers backups
          ls -t /backups/*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm
          echo \"[backup] Done. Next in 24h.\"
          sleep 86400
        done
      "

volumes:
  postgres_data:
  pg_backups:
  letsencrypt:

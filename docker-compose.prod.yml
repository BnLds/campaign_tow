services:
  # ── Reverse proxy ──
  traefik:
    image: traefik:v3.4
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      # Décommenter quand tu auras un domaine :
      # - --entrypoints.websecure.address=:443
      # - --certificatesresolvers.letsencrypt.acme.email=ton@email.com
      # - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    environment:
      DOCKER_API_VERSION: "1.45"
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  # ── Application ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=PathPrefix(`/`)
      - traefik.http.routers.app.entrypoints=web
      - traefik.http.services.app.loadbalancer.server.port=3000
      # Décommenter avec un domaine :
      # - traefik.http.routers.app.rule=Host(`ton-domaine.com`)
      # - traefik.http.routers.app.entrypoints=websecure
      # - traefik.http.routers.app.tls.certresolver=letsencrypt

  # ── Database ──
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backup cron ──
  pg_backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - pg_backups:/backups
    entrypoint: >
      bash -c "
        while true; do
          FILENAME=/backups/${POSTGRES_DB}_$$(date +%Y%m%d_%H%M%S).sql.gz
          echo \"[backup] Starting: $$FILENAME\"
          pg_dump | gzip > $$FILENAME
          # Garder les 7 derniers backups
          ls -t /backups/*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm
          echo \"[backup] Done. Next in 24h.\"
          sleep 86400
        done
      "

volumes:
  postgres_data:
  pg_backups:
  letsencrypt:

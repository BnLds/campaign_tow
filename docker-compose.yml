services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: campaign_tow
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: campaign_tow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
